{% extends "base.html" %}
{% block title %}Add service - Auto-Cron{% endblock %}
{% block content %}
<div class="card">
  <h1>Add service</h1>
  <p class="muted">Choose a type:</p>
  <ul class="types">
    {% for t in types %}
      <li><a class="btn" href="{{ url_for('main.service_new', type=t.type) }}">{{ t.label }}</a></li>
    {% endfor %}
  </ul>
  <p><a href="{{ url_for('main.index') }}">Back</a></p>
</div>
{% endblock %}
